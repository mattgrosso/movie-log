<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-label="Six Degrees">
  <defs>
    <linearGradient id="sd-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0e1116"/>
      <stop offset="55%" stop-color="#161c22"/>
      <stop offset="100%" stop-color="#1d252c"/>
    </linearGradient>
    <radialGradient id="sd-glow" cx="46%" cy="48%" r="70%">
      <stop offset="0%" stop-color="#ffb300" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#ffb300" stop-opacity="0"/>
    </radialGradient>
    <filter id="sd-node-glow" x="-200%" y="-200%" width="500%" height="500%">
      <feGaussianBlur stdDeviation="14"/>
    </filter>
  </defs>

  <rect x="0" y="0" width="1600" height="900" fill="url(#sd-bg)"/>
  <rect x="0" y="0" width="1600" height="900" fill="url(#sd-glow)"/>

  <!-- Full-bleed starfield - lots of small faint points and a few short
       connecting lines, scattered across the whole canvas. Leaning into
       this (the one part of the earlier draft that landed) rather than a
       literal row of movie/person icons. -->
  <g stroke="#90a4ae" stroke-width="1.5" opacity="0.16">
    <line x1="90" y1="120" x2="180" y2="90"/>
    <line x1="180" y1="90" x2="260" y2="140"/>
    <line x1="60" y1="260" x2="140" y2="300"/>
    <line x1="360" y1="80" x2="430" y2="120"/>
    <line x1="620" y1="60" x2="690" y2="100"/>
    <line x1="690" y1="100" x2="760" y2="70"/>
    <line x1="900" y1="130" x2="980" y2="90"/>
    <line x1="1080" y1="70" x2="1160" y2="110"/>
    <line x1="1160" y1="110" x2="1240" y2="80"/>
    <line x1="1340" y1="140" x2="1420" y2="180"/>
    <line x1="1480" y1="100" x2="1550" y2="140"/>
    <line x1="40" y1="600" x2="110" y2="650"/>
    <line x1="180" y1="700" x2="250" y2="670"/>
    <line x1="250" y1="670" x2="320" y2="720"/>
    <line x1="520" y1="760" x2="600" y2="800"/>
    <line x1="600" y1="800" x2="690" y2="770"/>
    <line x1="820" y1="820" x2="900" y2="850"/>
    <line x1="1020" y1="780" x2="1100" y2="810"/>
    <line x1="1240" y1="750" x2="1310" y2="790"/>
    <line x1="1310" y1="790" x2="1400" y2="760"/>
    <line x1="1460" y1="640" x2="1540" y2="670"/>
    <line x1="1500" y1="480" x2="1560" y2="440"/>
    <line x1="60" y1="420" x2="130" y2="450"/>
  </g>
  <g fill="#cfd8dc" opacity="0.28">
    <circle cx="90" cy="120" r="4"/><circle cx="180" cy="90" r="4"/><circle cx="260" cy="140" r="3"/>
    <circle cx="60" cy="260" r="3"/><circle cx="140" cy="300" r="4"/>
    <circle cx="360" cy="80" r="3"/><circle cx="430" cy="120" r="4"/>
    <circle cx="620" cy="60" r="4"/><circle cx="690" cy="100" r="3"/><circle cx="760" cy="70" r="4"/>
    <circle cx="900" cy="130" r="3"/><circle cx="980" cy="90" r="4"/>
    <circle cx="1080" cy="70" r="4"/><circle cx="1160" cy="110" r="3"/><circle cx="1240" cy="80" r="4"/>
    <circle cx="1340" cy="140" r="3"/><circle cx="1420" cy="180" r="4"/>
    <circle cx="1480" cy="100" r="3"/><circle cx="1550" cy="140" r="4"/>
    <circle cx="40" cy="600" r="4"/><circle cx="110" cy="650" r="3"/>
    <circle cx="180" cy="700" r="4"/><circle cx="250" cy="670" r="3"/><circle cx="320" cy="720" r="4"/>
    <circle cx="520" cy="760" r="3"/><circle cx="600" cy="800" r="4"/><circle cx="690" cy="770" r="3"/>
    <circle cx="820" cy="820" r="4"/><circle cx="900" cy="850" r="3"/>
    <circle cx="1020" cy="780" r="4"/><circle cx="1100" cy="810" r="3"/>
    <circle cx="1240" cy="750" r="3"/><circle cx="1310" cy="790" r="4"/><circle cx="1400" cy="760" r="3"/>
    <circle cx="1460" cy="640" r="4"/><circle cx="1540" cy="670" r="3"/>
    <circle cx="1500" cy="480" r="4"/><circle cx="1560" cy="440" r="3"/>
    <circle cx="60" cy="420" r="3"/><circle cx="130" cy="450" r="4"/>
    <circle cx="800" cy="380" r="3"/><circle cx="240" cy="480" r="3"/><circle cx="1300" cy="330" r="3"/>
  </g>

  <!-- The network proper: eight hub nodes with cross-links, so it reads as
       a genuine web rather than one straight line - closer to the actual
       "six degrees of separation" idea (lots of possible paths, only some
       of them short). One six-node path through it is drawn brighter/
       thicker than the rest, as a quiet nod to the game itself without
       spelling it out in text or literal poster/photo icons. -->
  <g stroke="#ffc107" stroke-width="3" opacity="0.32">
    <line x1="220" y1="620" x2="300" y2="220"/>
    <line x1="480" y1="340" x2="180" y2="220"/>
    <line x1="1180" y1="520" x2="1300" y2="700"/>
    <line x1="1400" y1="300" x2="1300" y2="700"/>
  </g>
  <g stroke="#ffc107" stroke-width="6" stroke-linecap="round" opacity="0.72" filter="url(#sd-node-glow)" fill="none">
    <path d="M220,620 L480,340 L760,560 L980,260 L1180,520 L1400,300"/>
  </g>
  <g stroke="#ffc107" stroke-width="5" stroke-linecap="round" opacity="0.85" fill="none">
    <path d="M220,620 L480,340 L760,560 L980,260 L1180,520 L1400,300"/>
  </g>

  <!-- Soft glow bloom behind every hub node. -->
  <g fill="#ffc107" opacity="0.35" filter="url(#sd-node-glow)">
    <circle cx="220" cy="620" r="16"/>
    <circle cx="480" cy="340" r="22"/>
    <circle cx="760" cy="560" r="18"/>
    <circle cx="980" cy="260" r="14"/>
    <circle cx="1180" cy="520" r="20"/>
    <circle cx="1400" cy="300" r="16"/>
    <circle cx="300" cy="220" r="11"/>
    <circle cx="1300" cy="700" r="13"/>
  </g>
  <!-- Sharp cores on top, brighter on the highlighted six-node path than
       the two extra web nodes. -->
  <g>
    <circle cx="220" cy="620" r="10" fill="#ffca28"/>
    <circle cx="480" cy="340" r="13" fill="#ffe082"/>
    <circle cx="760" cy="560" r="11" fill="#ffca28"/>
    <circle cx="980" cy="260" r="9" fill="#ffca28"/>
    <circle cx="1180" cy="520" r="12" fill="#ffe082"/>
    <circle cx="1400" cy="300" r="10" fill="#ffca28"/>
    <circle cx="300" cy="220" r="6" fill="#b0703a"/>
    <circle cx="1300" cy="700" r="7" fill="#b0703a"/>
  </g>
</svg>
