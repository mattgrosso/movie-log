<!DOCTYPE html>
<html lang="">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <!-- viewport-fit=cover: without it iOS reports env(safe-area-inset-*) as 0
         even though the standalone PWA already draws full-bleed under the
         Dynamic Island (the 'black' status-bar style renders transparent on
         modern iOS). Geometry doesn't change — this only unlocks real inset
         values for things like the awards sticky-bar shade. -->
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=0, viewport-fit=cover"/>
    <meta name="theme-color" content="#000000">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Charmonman:wght@400;700&family=Clicker+Script&family=Galada&family=Grand+Hotel&family=Lobster&family=Roboto+Condensed:ital,wght@0,100..900;1,100..900&family=Send+Flowers&family=Updock&display=swap" rel="stylesheet">
    <link rel="icon" href="<%= BASE_URL %>img/icons/apple-touch-icon.png">
    <link rel="apple-touch-icon" href="<%= BASE_URL %>img/icons/apple-touch-icon.png">
    <link rel="apple-touch-icon" sizes="60x60" href="<%= BASE_URL %>img/icons/apple-touch-icon-60x60.png">
    <link rel="apple-touch-icon" sizes="76x76" href="<%= BASE_URL %>img/icons/apple-touch-icon-76x76.png">
    <link rel="apple-touch-icon" sizes="120x120" href="<%= BASE_URL %>img/icons/apple-touch-icon-120x120.png">
    <link rel="apple-touch-icon" sizes="152x152" href="<%= BASE_URL %>img/icons/apple-touch-icon-152x152.png">
    <link rel="apple-touch-icon" sizes="180x180" href="<%= BASE_URL %>img/icons/apple-touch-icon-180x180.png">
    <link rel="manifest" href="<%= BASE_URL %>manifest.json">
    <title><%= htmlWebpackPlugin.options.title %></title>
  </head>
  <body class="bg-dark">
    <noscript>
      <strong>We're sorry but <%= htmlWebpackPlugin.options.title %> doesn't work properly without JavaScript enabled. Please enable it to continue.</strong>
    </noscript>
    <div id="app"></div>
    <!-- built files will be auto injected -->
  </body>
</html>
